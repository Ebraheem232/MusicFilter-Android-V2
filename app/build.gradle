plugins {
    id 'com.android.application'
}

android {
    namespace 'com.musicfilter.app'
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'com.musicfilter.app.v2'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '2.0.0'
        testInstrumentationRunner 'com.musicfilter.app.FullVideoAudit'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release { signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
    def media3Version = '1.10.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-inspector:$media3Version"
    implementation "androidx.media3:media3-muxer:$media3Version"
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    // DTTNet's exact 6,144-point complex STFT/ISTFT is implemented with this
    // pure-Java FFT library; it keeps the quality pipeline fully offline.
    implementation 'com.github.wendykierp:JTransforms:3.1'
}
